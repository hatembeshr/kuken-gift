<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 260" width="120" height="260">
  <defs>
    <radialGradient id="flameGlow">
      <stop offset="0" stop-color="#fff6a2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff6a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1dcd6"/>
      <stop offset=".5" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f4d9d0"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle id="glow" cx="60" cy="38" r="34" fill="url(#flameGlow)">
    <animate attributeName="r" values="31;36;31" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;.9;.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- candle -->
  <rect x="43" y="65" width="34" height="150" rx="6" fill="url(#wax)" stroke="#c9a9a3" stroke-opacity=".35"/>

  <!-- pink stripes -->
  <g fill="#e98697">
    <rect x="39" y="88" width="42" height="7" rx="4" transform="rotate(25 60 91)" opacity=".9"/>
    <rect x="39" y="115" width="42" height="7" rx="4" transform="rotate(25 60 118)" opacity=".76"/>
    <rect x="39" y="142" width="42" height="7" rx="4" transform="rotate(25 60 145)" opacity=".63"/>
    <rect x="39" y="169" width="42" height="7" rx="4" transform="rotate(25 60 172)" opacity=".52"/>
    <rect x="39" y="196" width="42" height="7" rx="4" transform="rotate(25 60 199)" opacity=".42"/>
  </g>

  <!-- wick -->
  <rect x="58" y="57" width="4" height="13" rx="2" fill="#273c4b"/>

  <!-- flame -->
  <g id="flame" style="cursor:pointer">
    <path d="M60 62 C45 50 49 31 61 15 C72 31 78 45 69 57 C66 61 63 63 60 62Z" fill="#ffee86">
      <animate attributeName="d"
        values="M60 62 C45 50 49 31 61 15 C72 31 78 45 69 57 C66 61 63 63 60 62Z;
                M60 62 C49 51 52 35 61 19 C70 34 76 47 68 57 C65 61 62 63 60 62Z;
                M60 62 C45 50 49 31 61 15 C72 31 78 45 69 57 C66 61 63 63 60 62Z"
        dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M60 57 C54 50 56 41 61 32 C67 43 68 50 64 56 C63 58 61 59 60 57Z" fill="#ff5a36">
      <animate attributeName="opacity" values=".8;1;.8" dur=".9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- smoke, hidden until extinguished -->
  <g id="smoke" opacity="0">
    <circle cx="58" cy="35" r="6" fill="#d8d8d8"/>
    <circle cx="67" cy="24" r="8" fill="#eeeeee"/>
    <circle cx="61" cy="12" r="5" fill="#f7f7f7"/>
  </g>

  <!-- extinguish animation -->
  <g id="extinguish">
    <animate attributeName="opacity" values="0;0;1" dur="0.75s" fill="freeze"/>
  </g>
</svg>
