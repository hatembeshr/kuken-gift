<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 430"
     width="420" height="430">

  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6aeb8"/>
      <stop offset="1" stop-color="#e88998"/>
    </linearGradient>

    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fac4cb"/>
      <stop offset="1" stop-color="#ee9daa"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4df"/>
      <stop offset=".5" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f7e3c5"/>
    </linearGradient>

    <filter id="shadowBlur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse id="shadow"
           cx="210" cy="390" rx="145" ry="25"
           fill="#7d5558" opacity=".20"
           filter="url(#shadowBlur)">
    <animate attributeName="rx"
             values="125;145;125"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".16;.24;.16"
             dur="4s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- gift group: keeps the original source's floating/bouncing idea -->
  <g id="gift">

    <!-- box body -->
    <g id="body">
      <rect x="70" y="205" width="280" height="165" rx="12"
            fill="url(#box)"/>

      <!-- subtle top shading -->
      <rect x="70" y="205" width="280" height="28" rx="12"
            fill="#d77f8e" opacity=".20"/>

      <!-- vertical ribbon -->
      <rect x="184" y="205" width="52" height="165"
            fill="url(#ribbon)"/>

      <!-- side highlight -->
      <rect x="82" y="220" width="10" height="135" rx="5"
            fill="#fff4f0" opacity=".18"/>
    </g>

    <!-- lid -->
    <g id="lid">
      <rect x="50" y="150" width="320" height="70" rx="12"
            fill="url(#lid)"/>

      <!-- lid top highlight -->
      <rect x="58" y="157" width="304" height="12" rx="6"
            fill="#fff8f5" opacity=".30"/>

      <!-- lid ribbon -->
      <rect x="184" y="150" width="52" height="70"
            fill="url(#ribbon)"/>

      <!-- lid bottom shadow -->
      <rect x="50" y="205" width="320" height="15" rx="6"
            fill="#b96776" opacity=".18"/>
    </g>

    <!-- bow -->
    <g id="bow">
      <path d="M210 153
               C190 123 143 116 130 139
               C118 161 157 175 197 159
               Z"
            fill="#fff4df"/>

      <path d="M210 153
               C230 123 277 116 290 139
               C302 161 263 175 223 159
               Z"
            fill="#fff4df"/>

      <circle cx="210" cy="154" r="17"
              fill="#f3cfae"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -6;0 0"
                        dur="4s"
                        repeatCount="indefinite"/>
    </g>

    <!-- gentle floating animation -->
    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 0;0 -9;0 0"
                      dur="4s"
                      repeatCount="indefinite"/>
  </g>

  <!-- invisible click surface -->
  <rect id="clickArea"
        x="35" y="105" width="350" height="285"
        fill="transparent"/>
</svg>
